{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white shadow-2xl rounded-2xl p-8 text-center">
  <div class="mb-6">
    <div class="text-5xl mb-4 text-red-500">⚠️</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">ยืนยันการลบข้อมูล</h2>
    <p class="text-gray-600">
      คุณต้องการลบนัดหมายของ <b class="text-red-600">{{ appointment.patient_name }}</b> ใช่หรือไม่?
    </p>
  </div>

  <form method="POST" class="flex justify-center gap-4 mt-6">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg shadow-md transition duration-200 ease-in-out">
        ลบ
    </button>
    <a href="{% url 'appointments:list' %}"
       class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-5 py-2 rounded-lg transition">
        ยกเลิก
    </a>
  </form>
</div>
{% endblock %}
