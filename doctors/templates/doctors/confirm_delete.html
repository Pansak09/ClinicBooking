{% extends "base.html" %}
{% block title %}ยืนยันการลบแพทย์{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-10 bg-white shadow-md rounded-lg border border-gray-200 mt-10">

  <h2 class="text-2xl font-bold text-red-700 mb-4">ยืนยันการลบแพทย์</h2>

  <p class="text-gray-700 mb-6">
    คุณแน่ใจหรือไม่ว่าต้องการลบ
    <span class="font-semibold text-red-600">"{{ doctor.name }}"</span> ออกจากระบบ?
  </p>

  <form method="post" class="flex items-center space-x-4">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded shadow">
      ลบแพทย์
    </button>
    <a href="{% url 'doctors:list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-5 py-2 rounded shadow">
      ยกเลิก
    </a>
  </form>

</div>
{% endblock %}
